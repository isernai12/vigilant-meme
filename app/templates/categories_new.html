{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Create Category</h2>
    <form method="post">
        <label>Subject</label>
        <select name="subject_id" required>
            {% for subject in subjects %}
            <option value="{{ subject.id }}">{{ subject.name }}</option>
            {% endfor %}
        </select>
        <label>Name</label>
        <input name="name" required />
        <button type="submit" style="margin-top:1rem;">Create</button>
    </form>
</div>
{% endblock %}
